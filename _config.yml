# Site Settings
title: hyun-log
author: hyun
future: true

permalink: /:title/ #/:categories/:title/

plugins:
  - jekyll-redirect-from
  - jekyll-gist

addons:
  back_to_top: true # true (default), false
  share_post: true # true (default), false

header_pages:
  # - _pages/contact.md
  # - _pages/setup.md
  # - _pages/github.md
  - _pages/about.md
  - _pages/search.md
  - _pages/categories.md

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - whiteblogtheme.gemspec

comments:
  provider: "disqus" # false (default), "disqus"
  disqus:
    shortname: "vmsilvamolina"

analytics:
  google:
    tracking_id: "G-GDR66JH5FZ" # false (default), "G-XXXXXXXXXX"

sass:
  style: compressed
  sass_dir: _sass
  load_paths:
    - _sass

# MathJax 설정
markdown: kramdown
kramdown:
  math_engine: mathjax
  math_engine_opts:
    preview: true
    preview_as_code: true